name: Refresh Monie data feed

on:
  schedule:
    - cron: "17 14 * * 2"   # Tuesdays 14:17 UTC, after Indeed's weekly refresh
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python scripts/refresh_feed.py
      - name: Commit if changed
        run: |
          git config user.name "monie-bot"
          git config user.email "monie-bot@users.noreply.github.com"
          git add data/monie-feed.json
          git diff --cached --quiet || git commit -m "Refresh Monie data feed"
          git push
      - name: Open an issue when a ranking source publishes something new
        if: hashFiles('changed_sources.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Monie sources updated $(date +%F)" --body-file changed_sources.md
