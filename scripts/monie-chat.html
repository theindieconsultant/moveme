  .mc-fab:hover{animation:none;transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--shadow)}
  .mc-fab.seen{animation:none}
  @keyframes mcBounce{0%,40%,100%{transform:translateY(0)}8%{transform:translateY(-14px)}16%{transform:translateY(0)}22%{transform:translateY(-6px)}28%{transform:translateY(0)}}
  .mc-av{flex:none;width:60px;height:60px;border-radius:50%;background:var(--chartreuse);padding:4px;box-shadow:0 0 0 3px rgba(212,242,90,.35),0 0 14px 3px rgba(212,242,90,.75)}
  .mc-av svg{width:100%;height:100%;display:block;transform:translateY(1px)}
  .mc-head .mc-av{width:42px;height:42px;padding:3px}
  .mc-fine{margin:0;padding:0 12px 10px;background:var(--surface);text-align:center;font-size:11.5px;color:var(--text-subtle)}
  .mc-fab:focus-visible,.mc-panel :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .mc-fab .mc-dot{width:26px;height:26px;border-radius:50%;background:var(--chartreuse);color:var(--ink);display:grid;place-items:center;font-size:15px}
  .mc-panel{position:fixed;right:24px;bottom:122px;z-index:61;width:min(400px,calc(100vw - 24px));height:min(600px,calc(100vh - 150px));display:flex;flex-direction:column;background:var(--surface);color:var(--text);border:2px solid var(--border);border-radius:20px;box-shadow:6px 6px 0 var(--shadow);overflow:hidden;font-family:var(--sans)}
  .mc-panel[hidden]{display:none}
  .mc-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--cobalt);color:#fff}
  .mc-head b{font:700 17px/1.1 var(--display)}
  .mc-head small{display:block;font:500 12px/1.3 var(--sans);opacity:.85}
  .mc-head .mc-x{margin-left:auto;background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
  .mc-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
  .mc-msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45}
  .mc-msg.m{align-self:flex-start;background:var(--surface);border:1.5px solid var(--hair);border-bottom-left-radius:4px}
  .mc-msg.u{align-self:flex-end;background:var(--primary-soft);color:var(--text);border-bottom-right-radius:4px}
  .mc-msg ol{margin:8px 0 2px;padding-left:20px}
  .mc-msg li{margin:2px 0}
  .mc-msg .mc-src{display:block;margin-top:8px;font-size:12px;color:var(--text-subtle)}
  .mc-msg a{color:var(--link)}
  .mc-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;background:var(--bg)}
  .mc-chip{border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 11px;font:600 13px/1.2 var(--sans);cursor:pointer}
  .mc-chip:hover{background:var(--accent-soft)}
  .mc-form{display:flex;gap:8px;padding:10px;border-top:1.5px solid var(--hair);background:var(--surface)}
  .mc-form input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;font:500 14.5px var(--sans);background:var(--bg);color:var(--text)}

  .mc-typing{opacity:.6;font-style:italic}
  .mc-dots{display:inline-flex;gap:5px;padding:12px 14px}

     box-shadow:0 -10px 40px rgba(27,27,47,.16);animation:mcUp .4s cubic-bezier(.22,1,.36,1) both}

  .mc-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

  .mc-form{padding:10px max(12px,calc((100% - 700px) / 2));background:var(--bg);border-top:0}

  .mc-topics{flex:none;width:340px;border-left:1px solid var(--hair);border-top:0;padding:12px 22px;overflow-y:auto;background:var(--surface);font-size:13px;line-height:1.45;color:var(--text-subtle)}

  .mc-topics ul{margin:0 0 8px;padding-left:16px;display:flex;flex-direction:column;gap:5px}
  .mc-topics li::marker{color:var(--text-subtle)}
  @media (max-width:760px){
    .mc-tips{display:block}
    .mc-tips + .mc-x{margin-left:0}
    .mc-topics{display:none;position:absolute;inset:0;width:auto;border-left:0;z-index:2;font-size:15px;padding:16px 20px}
    .mc-panel.tips-open .mc-topics{display:block}
    .mc-panel.tips-open .mc-tips{background:rgba(255,255,255,.18)}
  }
  @media (max-width:520px){ .mc-panel{right:0;bottom:0;height:var(--chat-h)} .mc-fab{right:12px;bottom:12px;font-size:13px;padding:5px 14px 5px 5px} .mc-fab .mc-av{width:28px;height:28px} }
  @media (prefers-reduced-motion:reduce){ .mc-panel{animation:none} #mapView .stage{transition:none} }
</style>

<script>
// Monie: guided conversation (same questions as the quick quiz) + quick answers from data/monie-feed.json.
// Every conversation is logged to the "Chats" tab of the Move ♥ Me Sheet, once the Sheet's script supports it.
(() => {
const FEED_URL = "data/monie-feed.json";
const $ = id => document.getElementById(id);
const fab = $("mcFab"), panel = $("mcPanel"), log = $("mcLog"), chipsEl = $("mcChips"), topicsEl = $("mcTopics"), form = $("mcForm"), inp = $("mcIn");
let feed = null, loading = null, CH = null, queue = Promise.resolve(), gen = 0, chatLogOn = false;
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduceMotion() ? Math.min(ms, 120) : ms));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => "$" + Number(n).toLocaleString("en-US");
const MONIE_SAYS = {
  hello: ["hey, i’m <b>Monie</b> 👋🏽", "i help people find the places in America most likely to move them. so, what are you moving for?"],
  reasonChips: [["for love ♥", "love"], ["for work 💼", "jobs"], ["honestly, both", "both"]],
  both: "love that. let’s do one now and the other right after. which first?",
  reasonRetry: "ha, fair. if you had to start with one: love, or work?",
  welcomeBack: (prev, now) => [`welcome back 💛 last time we talked ${prev === "jobs" ? "work" : "love"}.`,
    `this time is about ${now === "jobs" ? "work" : "love"}, and i remember the rest, so it’s just two quick questions.`],
  scene: r => r === "jobs" ? "a dream job hits different with the right view. which of these moves you most?"
    : "picture your perfect first date. what’s the backdrop?",
  sceneEcho: { "Mountains": "mountain person, noted 🏔️", "Beach fronts": "beach person, noted 🌊", "City skylines": "city lights it is 🌆", "Trees & Trails": "trees & trails, noted 🌲" },
  sceneRetry: "i didn’t quite catch that. mountains, beach fronts, city skylines, or trees & trails?",
  places: "any states or cities already on your radar? name as many as you like.",
  placesEcho: list => `ooh, ${list}. noted ✍🏽`,
  placesNone: "totally fine, that’s what the map is for.",
  placesRetry: "i couldn’t match that to a state or city. try something like <b>Colorado</b> or <b>Austin, TX</b>, or tap <b>not sure yet</b>.",
  home: "where are you living right now?",
  homeState: st => `which city in ${st}?`,
  homeRetry: "i just need a city here, so i can compare it with where you might go.",
  age: "and how old are you? just the number. it stays between us (and a spreadsheet).",
  ageRetry: "just the number works, like <b>29</b>.",
  sign: "ok, the fun one ✨ what’s your sign? if you’re not sure, tell me your birthday.",
  signFromBday: s => `that makes you a <b>${s}</b>.`,
  signRetry: "hmm, i couldn’t find a sign in that. try one like <b>Leo</b>, or a birthday like <b>Aug 3</b>.",
  industry: "what field do you work in, or want to? tap all that fit, then <b>done</b>. or just tell me.",
  industryEcho: list => `${list}, got it.`,
  comment: r => r === "jobs" ? "last one, and totally optional: what’s the job hunt like where you live?"
    : "last one, and totally optional: what’s dating like where you live?",
  commentThanks: "thank you for sharing that 💛",
  doneLove: (sign, pairs, scene) => [`you’re a ${sign}, and you pair nicely with <b>${pairs}</b>.`,
    `i lit up the love map with hot spots${scene ? ` for ${MONIE_SAYS.people[scene]}` : ""}. hover any state for its love snapshot, or tap a hot spot for local facts.`],
  doneJobs: (inds, scene) => [`you work in <b>${inds}</b>.`,
    `the career map is all yours now${scene ? `, with hot spots for ${MONIE_SAYS.people[scene]}` : ""}. hover any state for its career snapshot.`],
  afterChips: other => [["show me the map", "map"], [other === "jobs" ? "now do work 💼" : "now do love ♥", "other"], ["start over", "restart"]],
  afterBoth: [["show me the map", "map"], ["start over", "restart"]],
  people: { "Mountains": "mountain people", "Beach fronts": "beach people", "City skylines": "city people", "Trees & Trails": "trees-and-trails people" },
  hiAgain: (reason, both) => [`hey again 👋🏽 your ${reason === "jobs" ? "career" : "love"} map is all set.`, both ? "want to see it, or start fresh?" : `want to see it, do the ${reason === "jobs" ? "love" : "work"} side too, or start fresh?`],
  idle: "i’m still here whenever you’re ready."
};
// ---------- understanding free text ----------
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ,&'.-]/g, " ").replace(/\s+/g, " ").trim();
const reEsc = w => w.replace(/[.*+?^$|()[\]{}\\]/g, "\\$&");
const wordIn = (text, w) => new RegExp("(^|[^a-z])" + reEsc(w) + "([^a-z]|$)").test(text);
const listText = arr => arr.length > 1 ? arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1] : arr.join("");
const NO = /^(no|nope|nah|none|not (really|sure|yet)|not sure yet|idk|i don'?t know|skip|pass|nothing|anywhere|n\/a|na)\b/;
const CITY_ALIAS = { "boise city": "boise" };   // official names people rarely type in full
function findCities(raw){
  // longest names first, so "Kansas City" wins over "Kansas" and "New York" over "York"
  const t = norm(raw), found = [];
  let rest = " " + t + " ";
  const byLen = CITIES.slice().sort((a, b) => b.c.length - a.c.length);
  for (const c of byLen) {
    const on = norm(c.c); let n = on; if (CITY_ALIAS[n] && !wordIn(rest, n) && wordIn(rest, CITY_ALIAS[n])) n = CITY_ALIAS[n];
    if (n.length < 3 || !wordIn(rest, n)) continue;
    // prefer "Portland, ME" when the state is named right after the city
    const after = rest.slice(rest.indexOf(n) + n.length, rest.indexOf(n) + n.length + 24);
    const twin = CITIES.filter(x => norm(x.c) === on);
    let pick = twin[0];
    for (const x of twin) { const sName = norm((STATE_LIST.find(s => s.abbr === x.st) || {}).name || ""); if (new RegExp("^[ ,]*(" + x.st.toLowerCase() + "|" + sName + ")\\b").test(after)) pick = x; }
    if (!found.includes(pick)) found.push(pick);
    rest = rest.replace(n, " ");
  }
  return { cities: found, rest };
}
function findStates(text, rawText){
  const out = [];
  STATE_LIST.slice().sort((a, b) => b.name.length - a.name.length).forEach(s => { const n = norm(s.name); if (wordIn(text, n)) { out.push(s); text = text.replace(n, " "); } });
  // two-letter codes only when typed in capitals, skipping ones that are also everyday words
  (rawText.match(/\b[A-Z]{2}\b/g) || []).forEach(code => {
    if (["OK", "HI", "ME", "OR", "IN", "OH", "AS"].includes(code)) return;
    const s = STATE_LIST.find(x => x.abbr === code); if (s && !out.includes(s)) out.push(s);
  });
  return out;
}
function parsePlaces(raw){
  const { cities, rest } = findCities(raw);
  // drop states that only appear as the ", TX" after a city
  let rawRest = raw; cities.forEach(c => { rawRest = rawRest.replace(new RegExp(reEsc(c.c) + "\\s*,?\\s*(" + c.st + "|" + ((STATE_LIST.find(s => s.abbr === c.st) || {}).name || c.st) + ")?", "i"), " "); });
  const states = findStates(norm(rawRest), rawRest);
  return states.map(s => ({ type: "state", value: s.abbr, label: s.name })).concat(cities.map(c => ({ type: "city", value: c.label, label: c.label })));
}
function parseReason(t){
  if (/\bboth\b|\b(and|&) (work|love|job)/.test(t)) return "both";
  const love = /lov|dat(e|ing)|partner|relationship|romance|my person|single|boyfriend|girlfriend|wife|husband|spouse|match|crush/.test(t);
  const job = /\bjob|work|career|employ|hire|hiring|salary|paycheck|gig|profession|industry|money/.test(t);
  return love && job ? "both" : love ? "love" : job ? "jobs" : null;
}
const SCENE_WORDS = [["Mountains", /mountain|peak|ski|snow|hik|alpine|rock|summit|elevation/], ["Beach fronts", /beach|ocean|coast|sea\b|seaside|surf|sand|shore|water|lake|island|wave/],

function parseScene(t){ const hit = SCENE_WORDS.filter(([, re]) => re.test(t)); return hit.length === 1 ? hit[0][0] : hit.length ? hit[0][0] : null; }

function signFromDate(m, d){
  // [month, last day of the earlier sign, earlier sign, later sign]
  const cut = [[1, 19, "Capricorn", "Aquarius"], [2, 18, "Aquarius", "Pisces"], [3, 20, "Pisces", "Aries"], [4, 19, "Aries", "Taurus"], [5, 20, "Taurus", "Gemini"], [6, 20, "Gemini", "Cancer"],
    [7, 22, "Cancer", "Leo"], [8, 22, "Leo", "Virgo"], [9, 22, "Virgo", "Libra"], [10, 22, "Libra", "Scorpio"], [11, 21, "Scorpio", "Sagittarius"], [12, 21, "Sagittarius", "Capricorn"]][m - 1];
  return d <= cut[1] ? cut[2] : cut[3];
}
function parseSign(t){
  const named = SIGN_INFO.map(([n]) => n).find(n => wordIn(t, n.toLowerCase()) || (n === "Sagittarius" && /\bsag\b/.test(t)) || (n === "Capricorn" && /\bcap\b/.test(t)));
  if (named) return { sign: named };
  let m = t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.? (\d{1,2})/), mo, dd;
  if (m) { mo = MON3.indexOf(m[1]) + 1; dd = +m[2]; }
  else if ((m = t.match(/\b(\d{1,2}) (jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/))) { mo = MON3.indexOf(m[2]) + 1; dd = +m[1]; }
  else if ((m = t.match(/\b(\d{1,2})[\/.-](\d{1,2})\b/))) { mo = +m[1]; dd = +m[2]; }

}

// Each step: ask() says the question and shows suggestions; take(text, val) handles a typed or tapped answer

const STEPS = {

    take(text, val){

      if (!r) { say(MONIE_SAYS.reasonRetry); chips(MONIE_SAYS.reasonChips.slice(0, 2)); return false; }
      CH.A.reason = r; return true;
    }
  },
  scene: {
    ask(){ say(MONIE_SAYS.scene(CH.A.reason)); chips([["⛰️ Mountains", "Mountains"], ["🏖️ Beach fronts", "Beach fronts"], ["🏙️ City skylines", "City skylines"], ["🌲 Trees & Trails", "Trees & Trails"]]); },
    take(text, val){
      const s = val || parseScene(norm(text));

    }

  places: {
    ask(){ say(MONIE_SAYS.places); chips([["not sure yet", "__none"]], { quiet: ["__none"] }); },
    take(text, val){
      if (val === "__none" || NO.test(norm(text))) { CH.A.places = []; say(MONIE_SAYS.placesNone); return true; }
      const p = parsePlaces(text);
      if (!p.length) { say(MONIE_SAYS.placesRetry); return false; }
      CH.A.places = p; say(MONIE_SAYS.placesEcho(listText(p.map(x => `<b>${esc(x.label)}</b>`)))); return true;

  home: {
    ask(){ say(MONIE_SAYS.home); clearChips(); },
    take(text){

      const st = STATE_LIST.find(s => norm(s.name) === norm(raw) || s.abbr === raw.toUpperCase());
      if (st) { say(MONIE_SAYS.homeState(st.name)); return false; }

  age: {

    }

  sign: {
    ask(){ say(MONIE_SAYS.sign); chips(SIGN_INFO.map(([n]) => [n, n, ZI(n)])); },
    take(text, val){

    }

  industry: {
    ask(){ say(MONIE_SAYS.industry); CH.pick = []; chips(INDUSTRIES.filter(([n]) => n !== "Other").map(([n]) => [n, n, INDICON(n)]), { multi: true }); },
    take(text, val){

function say(lines){

    for (const html of lines) {
      if (g !== gen) return;
      const t = document.createElement("div"); t.className = "mc-msg m mc-dots"; t.setAttribute("aria-label", "Monie is typing"); t.innerHTML = "<i></i><i></i><i></i>";

  if (k === "hiring" && T.live) extra = topList(T.live.states.slice(0, 5).map(s => [s.state, `${s.index} (${s.vsYearAgo >= 0 ? "+" : ""}${s.vsYearAgo} in a year)`]));
  else if (k === "business" && T.live) extra = "<b>Fastest-growing states for new businesses:</b>" + topList(T.live.statesByGrowth.slice(0, 5).map(s => [s.state, `+${s.vsYearAgoPct}% vs. a year ago`]));

function topicFor(text){
  const s = text.toLowerCase();
  if (feed && /pay|salar|wage|earn/.test(s)) for (const ind of Object.keys(feed.topics.pay.byIndustry)) {
    const words = ind.toLowerCase().split(/[^a-z]+/).filter(w => w.length > 3);
    if (words.some(w => s.includes(w))) return () => payFor(ind);
  }
  const hit = ROUTES.find(([, re]) => re.test(s));
  return hit ? () => topicAnswer(hit[0]) : null;
}
const looksLikeQuestion = t => /\?\s*$|^(which|where|what|who|how|best|top|most|any|is|are|can|do)\b/i.test(t.trim());

    body: JSON.stringify({ type: "question", map: MODE, topic: "Monie chat", place: "Monie chat", placeType: "chat", state: "", text: text.slice(0, 1000), source: SITE_SOURCE }) }).catch(() => {}); } catch (e) {}

// ---------- the guided conversation ----------
function startChat(opts = {}){
  gen++; log.innerHTML = ""; clearChips(); queue = Promise.resolve(); lastFlowChips = null;
  const reason = opts.reason || modeReason(), prev = getRes(otherReason(reason));
  CH = { A: blank(), flow: FULL_CHAT, i: 0, pick: [], both: false, ...newLog() };
  if (opts.reason || (prev && !getRes(reason))) {
    const p = prev || {};
    CH.flow = p.reason ? SHORT_CHAT : FULL_CHAT.slice(1);
    Object.assign(CH.A, { reason, scene: p.scene || null, places: (p.places || []).slice(), age: p.age || "", home: p.home || "" });
    if (p.reason) say(MONIE_SAYS.welcomeBack(p.reason, reason));
  }
  STEPS[stepName()].ask();
}
function greetBack(){
  gen++; log.innerHTML = ""; clearChips(); queue = Promise.resolve();
  const r = getRes(modeReason()), other = otherReason(r.reason), both = !!getRes(other);
  CH = { A: Object.assign(blank(), r), flow: [], i: 0, pick: [], done: true, ...newLog() };
  say(MONIE_SAYS.hiAgain(r.reason, both)).then(() => chips(both ? MONIE_SAYS.afterBoth : MONIE_SAYS.afterChips(other)));
}
function answer(text, val, shown){ if (!CH) return; const c = CH; queue = queue.then(() => { if (CH === c) answerNow(text, val, shown); }); }
function answerNow(text, val, shown){
  // quick-answer buttons (industry or sign for a quick answer)
  if (val && val.startsWith("__tind:")) { addMsg("u", esc(shown)); clearChips(); payFor(val.slice(7)); return logAfterNow(); }
  if (val && val.startsWith("__tsign:")) { addMsg("u", esc(shown)); clearChips(); starsFor(val.slice(8)); return logAfterNow(); }
  // a typed question about a topic gets a quick answer, then the conversation carries on
  if (!val && text && looksLikeQuestion(text)) { const go = topicFor(text); if (go) { addMsg("u", esc(text)); clearChips(); go(); return logAfterNow(); } }
  if (CH.done) return afterAnswer(val, text);
  const st = STEPS[stepName()];
  addMsg("u", esc(shown || text)); clearChips();
  if (!st.take(text, val)) {
    if (!CH.both || st !== STEPS.reason || CH.A.reason) CH.misses++;
    if (!chipsEl.innerHTML) restoreFlowChips();
    return logAfterNow();
  }
  CH.i++;
  if (CH.i < CH.flow.length) STEPS[stepName()].ask(); else finishChat();
  logAfterNow();
}
function finishChat(){
  const a = CH.A, jobs = a.reason === "jobs";
  const result = { reason: a.reason, scene: a.scene, sign: jobs ? null : a.sign, industries: jobs ? a.industries : [], industryOther: jobs ? a.industryOther : "",
    places: a.places, age: a.age, home: a.home, comment: a.comment, at: new Date().toISOString() };
  setRes(a.reason, result);
  sendAnswers({ ...result, via: "Chat" });
  LS.set("mm-quiz-seen", true);
  showResult(result);
  setMode(jobs ? "career" : "love", { quiet: true });
  replayMapIntro(); renderTopics();
  const pairs = PAIRS[result.sign] || [];
  say(jobs ? MONIE_SAYS.doneJobs(listText(industryLabels(result)), result.scene)
    : MONIE_SAYS.doneLove(`<b>${result.sign}</b>`, pairs.length > 1 ? pairs.slice(0, -1).join(", ") + " & " + pairs[pairs.length - 1] : pairs.join(""), result.scene))
    .then(() => { const other = otherReason(a.reason); chips(getRes(other) ? MONIE_SAYS.afterBoth : MONIE_SAYS.afterChips(other)); });
  CH.done = true;
}
function afterAnswer(val, text){
  const t = norm(text || "");
  const v = val || (/map|show|done|thanks|thank/.test(t) ? "map" : /again|over|restart|reset/.test(t) ? "restart" : /work|job|career|love|dat/.test(t) ? "other" : null);
  if (text) addMsg("u", esc(text));
  if (v === "map") { logChat(); close(); holdHovers(); setTimeout(() => window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" }), reduceMotion() ? 0 : 200); return; }
  if (v === "restart") return startChat();
  if (v === "other") { const other = otherReason(CH.A.reason); setMode(other === "jobs" ? "career" : "love", { quiet: true }); renderTopics(); return startChat({ reason: other }); }
  if (text) logQuestion(text);
  say("good question! i don’t have numbers for that yet, so i’ve passed it to the Move ♥ Me team. try one of the quick answers below in the meantime.");
  logAfterNow();
}

// ---------- full transcripts → "Chats" tab (one row per conversation, updated after each reply) ----------
function newLog(){ return { id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8), log: [], said: 0, misses: 0 }; }
function logChat(status){
  if (!chatLogOn || !CH || !CH.said) return;
  const payload = { type: "chat", chatId: CH.id, status: status || (CH.done ? "finished" : "in progress"), map: MODE, reason: CH.A.reason || "",
    messages: CH.said, misses: CH.misses, transcript: CH.log.join("\n"), source: SITE_SOURCE };
  try { fetch(RESPONSES_URL, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) }).catch(() => {}); } catch (e) {}
}
// only log chats once the Sheet's script knows about them (older versions would put them in Responses)
try { fetch(RESPONSES_URL).then(r => r.text()).then(t => { chatLogOn = /chats version/i.test(t); }).catch(() => {}); } catch (e) {}
window.addEventListener("pagehide", () => { if (CH && CH.said && !CH.done) logChat("left"); });

// ---------- open / close / input ----------
const mapRatio = (() => { const svg = document.getElementById("map"), vb = svg && svg.viewBox && svg.viewBox.baseVal; return vb && vb.height ? vb.width / vb.height : 1.6; })();
document.documentElement.style.setProperty("--map-ratio", mapRatio.toFixed(4));
function fitMapAbove(){
  setTimeout(() => { const st = document.getElementById("stage"); if (!st) return;
    window.scrollTo({ top: Math.max(0, st.getBoundingClientRect().top + window.scrollY - 12), behavior: reduceMotion() ? "auto" : "smooth" }); }, 60);
}
function open(){
  document.body.classList.add("chatting"); holdHovers(); fitMapAbove();
  panel.hidden = false; fab.setAttribute("aria-expanded", "true"); fab.classList.add("seen"); load(); renderTopics();
  if (!CH || !log.children.length) { if (getRes(modeReason())) greetBack(); else startChat(); }
  setTimeout(() => inp.focus(), 50);
}
function close(){ panel.hidden = true; panel.classList.remove("tips-open"); document.body.classList.remove("chatting"); fab.setAttribute("aria-expanded", "false"); }
$("mcTips").addEventListener("click", () => { const on = panel.classList.toggle("tips-open"); $("mcTips").setAttribute("aria-expanded", String(on)); });
fab.addEventListener("click", () => panel.hidden ? open() : (close(), fab.focus()));
$("mcClose").addEventListener("click", () => { close(); fab.focus(); });
panel.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); close(); fab.focus(); } });
chipsEl.addEventListener("click", e => {
  const b = e.target.closest(".mc-chip"); if (!b) return;
  const val = b.dataset.val, label = b.querySelector(":scope > span:last-child").textContent;
  if (b.hasAttribute("aria-pressed")) {   // industries: tap to toggle, then "done"
    const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on);
    CH.pick = on ? CH.pick.concat(val) : CH.pick.filter(x => x !== val);
    const go = chipsEl.querySelector(".mc-chip.go");
    if (CH.pick.length && !go) chipsEl.insertAdjacentHTML("beforeend", `<button type="button" class="mc-chip go" data-val="__done"><span>done →</span></button>`);
    else if (!CH.pick.length && go) go.remove();
    return;
  }
  if (val === "__done") return answer("", "__done", listText(CH.pick));
  answer(label, val, label);
});
topicsEl.addEventListener("click", e => {
  const a = e.target.closest("[data-topic]"); if (!a) return; e.preventDefault(); panel.classList.remove("tips-open");
  const c = CH; queue = queue.then(() => { if (CH !== c) return; addMsg("u", esc(a.textContent)); clearChips(); topicAnswer(a.dataset.topic); logAfterNow(); });
});
form.addEventListener("submit", e => { e.preventDefault(); const q = inp.value.trim(); if (!q) return; inp.value = ""; answer(q, null); });
load();
})();
</script>
